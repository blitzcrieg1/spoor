name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      worker_latency:
        description: Measure strict-audit Linux worker launch latency
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup default stable
      - name: Build
        run: cargo build --locked --manifest-path rust/Cargo.toml --workspace
      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - name: Run README quick start
        run: python scripts/run_synthetic_trace.py
      - name: Check isolated Linux worker
        if: runner.os == 'Linux'
        run: |
          python scripts/test_worker_approval.py
          docker pull python:3.12-alpine
          worker_image="$(docker image inspect --format '{{.Id}}' python:3.12-alpine)"
          python -m venv "$RUNNER_TEMP/spoor-agentmetry"
          agentmetry_python="$RUNNER_TEMP/spoor-agentmetry/bin/python"
          "$agentmetry_python" -m pip install "agentmetry==0.13.0"
          "$agentmetry_python" scripts/check_isolated_worker.py "$worker_image" --agentmetry
      - name: Install fixture evaluator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check Sigma process fixtures
        run: python scripts/evaluate_lab_sigma.py
      - name: Check Sigma fixtures with Loki
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/spoor-loki"
          loki_python="$RUNNER_TEMP/spoor-loki/bin/python"
          "$loki_python" -m pip install "pySigma==2.1.1" "pySigma-backend-loki==0.16.0"
          container="$(docker run --detach --publish 127.0.0.1::3100 grafana/loki:3.7.10 -config.file=/etc/loki/local-config.yaml -reporting.enabled=false)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          endpoint="$(docker port "$container" 3100/tcp)"
          if ! "$loki_python" scripts/evaluate_loki_sigma.py --loki-url "http://$endpoint"; then
            docker logs --tail 30 "$container"
            exit 1
          fi
      - name: Measure strict-audit worker latency
        if: runner.os == 'Linux' && inputs.worker_latency
        shell: bash
        run: |
          worker_image="$(docker image inspect --format '{{.Id}}' python:3.12-alpine)"
          python scripts/benchmark_isolated_worker.py "$worker_image" | tee -a "$GITHUB_STEP_SUMMARY"
