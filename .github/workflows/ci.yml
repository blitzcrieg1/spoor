name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup default stable
      - name: Build
        run: cargo build --locked --manifest-path rust/Cargo.toml --workspace
      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - name: Run README quick start
        run: python scripts/run_synthetic_trace.py
      - name: Check isolated Linux worker
        if: runner.os == 'Linux'
        run: |
          python scripts/test_worker_approval.py
          docker pull python:3.12-alpine
          worker_image="$(docker image inspect --format '{{.Id}}' python:3.12-alpine)"
          python -m venv "$RUNNER_TEMP/spoor-agentmetry"
          agentmetry_python="$RUNNER_TEMP/spoor-agentmetry/bin/python"
          "$agentmetry_python" -m pip install "agentmetry==0.13.0"
          "$agentmetry_python" scripts/check_isolated_worker.py "$worker_image" --agentmetry
      - name: Install fixture evaluator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check Sigma process fixtures
        run: python scripts/evaluate_lab_sigma.py
