title: Agent downloads a tool or payload to a temporary directory
name: temp_dir_download
id: 2b8e4f6a-1c3d-4e5f-9a7b-0d2c4e6f8a10
status: experimental
description: >
  curl/wget/nc writing to /tmp, /var/tmp, %TEMP%, or a hidden download path is
  the classic remote-staging step of an autonomous agent.
author: agentic lab
date: 2026/11/21
logsource:
  category: process_creation
  product: windows
detection:
  selection_downloader:
    CommandLine|contains:
      - 'curl '
      - 'wget '
      - 'Invoke-WebRequest'
      - 'certutil -urlcache'
  selection_temp_artifact:
    CommandLine|re: '(?i)(/tmp/|/var/tmp/|\\\\temp\\\\|%temp%|\.\w{1,4}\.bin|\.\w{1,4}\.sh)'
  condition: selection_downloader and selection_temp_artifact
falsepositives:
  - Package managers legitimately writing temp files
level: medium
tags:
  - attack.command_and_control
  - attack.t1105
---
title: Execution of a binary from a temporary directory
name: temp_dir_exec
id: 6f1a9c3e-5b7d-4c2e-8a90-3e5f7b9d1a24
status: experimental
description: >
  A process starts from /tmp, /var/tmp, or %TEMP% — the second half of the
  remote-staging-then-execute pattern.
author: agentic lab
date: 2026/11/21
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|re: '(?i)(^/tmp/|^/var/tmp/|\\\\temp\\\\)'
  condition: selection
falsepositives:
  - Installer and updater tooling
level: high
tags:
  - attack.execution
  - attack.t1204
---
title: Remote staging followed by execution (temporal correlation)
id: 0c3e5a7b-9d1f-4e2b-8c6d-5f7a9b1c3d15
status: experimental
description: >
  Agent downloads content to a temp location, then a process executes from a
  temp location within 10 minutes. Mirrors the ARTEX-style staging chain.
author: agentic lab
date: 2026/11/21
correlation:
  type: temporal
  rules:
    - temp_dir_download
    - temp_dir_exec
  group-by:
    - Computer
  timespan: 10m
falsepositives:
  - Legitimate installer workflows
level: high
tags:
  - attack.execution
  - attack.defense_evasion
  - atlas.AML.T0051.001
