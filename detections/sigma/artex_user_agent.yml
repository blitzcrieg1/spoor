title: ARTEX Agentic Framework User Agent in Web Logs
id: 4b2f0f6a-6d1e-4f0e-9a3b-1f0d2c7e8a11
status: experimental
description: Requests whose user agent names ARTEX or its renamed builds.
references:
  - https://github.com/ThreatDefence/agentic-attack-detections/blob/7a29e1683b0b2100baf4b1986870c12e7ffe4a2a/frameworks/artex/sigma/web/web_artex_user_agent.yml
  - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
author: ThreatDefence (adapted for the Spoor lab)
date: 2026-11-22
tags:
  - attack.reconnaissance
  - attack.t1595.002
logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|contains:
      - 'artex-'
      - 'ARTEX-worker/'
      - 'ARTeX'
      - 'scopeweaver'
      - 'spa-api-recon'
      - 'norma/0.4'
  condition: selection
falsepositives:
  - Authorized ARTEX testing
level: high
