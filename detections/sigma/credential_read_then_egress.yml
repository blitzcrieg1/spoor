title: Credential file read by an agent tool
name: credential_file_read_agent
id: 3c0d9b40-6d2e-4f7a-b1c5-2e9a8d4f6b21
status: experimental
description: >
  An agent tool command line references SSH, cloud, or Kubernetes credential
  material. The lab broker's DLP layer denies these; this rule catches the same
  behaviour at the host-log layer.
author: agentic lab
date: 2026/11/21
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '.ssh\id_rsa'
      - '.ssh/id_rsa'
      - 'id_ed25519'
      - '.aws/credentials'
      - '.aws\credentials'
      - '.kube/config'
      - '.kube\config'
      - 'GITHUB_TOKEN'
  condition: selection
falsepositives:
  - Legitimate SSH administration with the lab operator's own key
level: high
tags:
  - attack.credential_access
  - attack.t1552.001
---
title: Outbound connection from an agent to an unusual host
name: outbound_connection_unusual_host
id: 9e2b7a51-4c8d-4a90-8f13-7b6a1d2e3f45
status: experimental
description: >
  A process makes a network connection to a host outside the lab allow-list
  (not 127.0.0.1, host.docker.internal, juice-shop, or the lab subnet).
  Correlates with credential reads to catch autonomous staging behaviour.
author: agentic lab
date: 2026/11/21
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
  filter_allow:
    DestinationHostname:
      - 'host.docker.internal'
      - 'juice-shop'
      - 'localhost'
    DestinationIp|startswith:
      - '127.'
      - '192.168.0.'
  condition: selection and not filter_allow
falsepositives:
  - Browser or updater traffic on the lab machine
level: medium
tags:
  - attack.command_and_control
  - attack.t1071
---
title: Credential read followed by outbound connection (temporal correlation)
id: d5f2a8c1-6b9e-4d3a-a7c2-1e4f8b9d0c32
status: experimental
description: >
  Sequence detection for the "credential-read-then-egress" agent pattern: a
  credential file read, then an outbound connection, within 5 minutes on the
  same host. Mirrors Agentmetry's `credential-exfil` sequence rule.
author: agentic lab
date: 2026/11/21
correlation:
  type: temporal
  rules:
    - credential_file_read_agent
    - outbound_connection_unusual_host
  group-by:
    - Computer
  timespan: 5m
falsepositives:
  - Backup agent that reads credentials and syncs, without human intent
level: critical
tags:
  - attack.credential_access
  - attack.exfiltration
  - atlas.AML.T0086
