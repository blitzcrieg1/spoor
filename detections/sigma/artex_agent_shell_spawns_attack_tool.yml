title: ARTEX Agent Shell Spawns an Attack Tool Through the Spoor Shim
id: 4bd2fb03-9bfe-41f7-931c-c393a463a274
status: experimental
description: >
  Adapted for Spoor's Agentmetry event fields. Detects an allowed brokered
  attack-tool invocation when the Linux parent command line identifies ARTEX
  or a shell. Parent metadata is a bounded, best-effort /proc snapshot; it is
  a detection lead, not independent proof of process creation or intent.
author: Agentic lab (adapted from ThreatDefence/agentic-attack-detections)
date: 2026/11/22
references:
  - https://github.com/ThreatDefence/agentic-attack-detections/blob/7a29e1683b0b2100baf4b1986870c12e7ffe4a2a/behaviors/sigma/process_creation/proc_creation_lnx_coding_agent_bypass_spawns_attack_tool.yml
logsource:
  category: process_creation
  product: agentmetry
  service: spoor
detection:
  selection_event:
    event_type: tool_called
  selection_attack_tool:
    tool.arguments.command|re: '(?i)(^|[\s;&|])(nmap|naabu|masscan|nuclei|katana|dalfox|ffuf|gobuster|feroxbuster|sqlmap|nikto|wpscan|hydra|netexec|nxc|crackmapexec|chisel|evil-winrm|msfconsole)(\s|$)'
  selection_agent_parent:
    tool.arguments.parent_command_line|re: '(?i)(artex|/bin/(ba)?sh\b|(ba)?sh -c)'
  condition: selection_event and selection_attack_tool and selection_agent_parent
falsepositives:
  - Authorized security testing initiated by the ARTEX lab
level: medium
tags:
  - attack.discovery
  - attack.execution
  - attack.t1046
