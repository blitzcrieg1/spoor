[package]
name = "spoor"
version = "0.2.2"
edition = "2021"
description = "Spoor bridge binary: broker, trail watcher, TraceSig export, replay gate"

[dependencies]
spoor-core = { path = "../spoor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "signal", "process"] }
axum = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
chrono = "0.4"
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
native-tls = "0.2"
tokio-native-tls = "0.3"
